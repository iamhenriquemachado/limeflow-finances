      - bearerAuth: []
    post:
      tags:
      - Budgets
      summary: Create a budget for a category and period
      operationId: CreateBudget
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBudgetRequest'
