          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/goals:
    get:
      tags:
      - Goals
      summary: List the authenticated user's savings goals
      operationId: GetGoals
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GoalResponse'
      security:
      - bearerAuth: []
    post:
      tags:
      - Goals
      summary: Create a savings goal
      operationId: CreateGoal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalRequest'
        required: true
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/goals/{id}:
    get:
      tags:
      - Goals
      summary: Get a goal by id, including progress
      operationId: GetGoalById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearerAuth: []
    put:
      tags:
      - Goals
      summary: Update a savings goal
      operationId: UpdateGoal
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGoalRequest'
        required: true
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearerAuth: []
    delete:
      tags:
      - Goals
      summary: Delete a savings goal
      operationId: DeleteGoal
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '204':
          description: No Content
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/goals/{id}/contributions:
    post:
      tags:
      - Goals
      summary: Add money to a goal
      operationId: ContributeToGoal
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalContributionRequest'
        required: true
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/goals/{id}/withdrawals:
    post:
      tags:
      - Goals
      summary: Withdraw money from a goal
      operationId: WithdrawFromGoal
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalWithdrawalRequest'
        required: true
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/reports/summary:
    get:
      tags:
      - Reports
      summary: Dashboard totals for a date range
      operationId: GetReportSummary
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSummaryResponse'
      security:
      - bearerAuth: []
  /api/v1/reports/by-category:
    get:
      tags:
      - Reports
      summary: Totals grouped by category
      operationId: GetReportByCategory
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/NullableOfTransactionType'
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryReportItem'
      security:
      - bearerAuth: []
  /api/v1/reports/monthly:
    get:
      tags:
      - Reports
      summary: Income and expense per month for a year
      operationId: GetMonthlyReport
      parameters:
      - name: year
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonthlyReportItem'
      security:
      - bearerAuth: []
components:
  schemas:
    AccountResponse:
      required:
      - id
      - name
      - bank
      - balance
      - createdAt
      - updatedAt
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        bank:
          type: string
        balance:
          type: number
          format: double
          description: Decimal with at most 2 fraction digits.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BudgetPeriod:
      type: string
      enum:
      - Weekly
      - Monthly
      - Yearly
      description: Weekly starts on Monday UTC. Monthly and Yearly follow the UTC calendar.
    BudgetResponse:
      required:
      - id
      - categoryId
      - limitAmount
      - alertThreshold
      - period
      - notes
      - createdAt
      - updatedAt
      type: object
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        limitAmount:
          type: number
          format: double
          description: Decimal with at most 2 fraction digits.
        alertThreshold:
          type: integer
          format: int32
        period:
          $ref: '#/components/schemas/BudgetPeriod'
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BudgetStatusResponse:
      required:
      - limitAmount
      - spent
      - remaining
      - percentUsed
      - isOverThreshold
      - isExceeded
      - periodStart
      - periodEnd
      type: object
      properties:
        limitAmount:
          type: number
          format: double
          description: Decimal with at most 2 fraction digits.
        spent:
          type: number
          format: double
          description: Decimal with at most 2 fraction digits.
        remaining:
          type: number
          format: double
          description: Decimal with at most 2 fraction digits.
        percentUsed:
          type: integer
          format: int32
        isOverThreshold:
          type: boolean
        isExceeded:
          type: boolean
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
      description: Computed for the current UTC period. percentUsed is rounded to an integer. remaining
        is limitAmount minus spent.
    CategoryReportItem:
      required:
      - categoryId
      - name
      - total
      - percent
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        name:
          type: string
        total:
          type: number
          format: double
          description: Decimal with at most 2 fraction digits.
        percent:
          type: number
          format: double
    CategoryResponse:
      required:
      - id
      - name
      - type
      - createdAt
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/TransactionType'
        createdAt:
          type: string
          format: date-time
    ChangePasswordRequest:
      required:
      - currentPassword
      - newPassword
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    CreateAccountRequest:
      required:
      - name
      - bank
      type: object
      properties:
        name:
          type: string
        bank:
          type: string
    CreateBudgetRequest:
      required:
      - categoryId
      - limitAmount
      - alertThreshold
      - period
      - notes
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        limitAmount:
          type: number
          format: double
          description: Decimal with at most 2 fraction digits.
        alertThreshold:
          type: integer
          format: int32
        period:
          $ref: '#/components/schemas/BudgetPeriod'
        notes:
          type: string
          nullable: true
    CreateCategoryRequest:
      required:
      - name
      - type
      type: object
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/TransactionType'
    CreateGoalRequest:
      required:
      - name
      - description
      - target
      - targetDate
      - monthlyContribution
      - icon
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        target:
          type: number
          format: double
          description: Decimal with at most 2 fraction digits.
        targetDate:
          type: string
          format: date-time
        monthlyContribution:
          type: number
          format: double
          description: Decimal with at most 2 fraction digits.
        icon:
          type: string
    CreateTransactionRequest:
      required:
      - accountId
      - categoryId
      - type
      - amount
      - description
      - transactionDate
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          type: number
          format: double
          description: Decimal with at most 2 fraction digits.
        description:
          type: string
        transactionDate:
          type: string
          format: date-time
          nullable: true
    CreateUserRequest:
      required:
      - name
      - email
      - password
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
    GoalContributionRequest:
      required:
      - amount
      - fromAccountId
      type: object
      properties:
        amount:
          type: number
          format: double
          description: Decimal with at most 2 fraction digits.
        fromAccountId:
          type: string
          format: uuid
          nullable: true
      description: fromAccountId is optional. When set, that account is debited in the same request and
        no expense transaction is created.
    GoalResponse:
      required:
      - id
      - name
      - description
      - target
      - alreadySaved
      - targetDate
      - monthlyContribution
      - icon
      - progressPercent
      - isCompleted
      - createdAt
      - updatedAt
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        target:
          type: number
          format: double
          description: Decimal with at most 2 fraction digits.
        alreadySaved:
          type: number
          format: double
          description: Decimal with at most 2 fraction digits.
        targetDate:
          type: string
          format: date-time
        monthlyContribution:
          type: number
          format: double
          description: Decimal with at most 2 fraction digits.
        icon:
          type: string
        progressPercent:
          type: number
          format: double
        isCompleted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      description: progressPercent is alreadySaved / target, capped at 100. isCompleted is true when alreadySaved
        >= target.
    GoalWithdrawalRequest:
      required:
      - amount
      type: object
      properties:
        amount:
          type: number
          format: double
          description: Decimal with at most 2 fraction digits.
    HttpValidationProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    LoginRequest:
      required:
      - email
      - password
      type: object
      properties:
        email:
          type: string
        password:
          type: string
    LoginResponse:
      required:
      - accessToken
      - tokenType
      - expiresIn
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int32
      description: expiresIn is the access token lifetime in seconds. There is no refresh token.
    MonthlyReportItem:
      required:
      - month
      - income
      - expense
      type: object
      properties:
        month:
          type: integer
          format: int32
        income:
          type: number
          format: double
        expense:
          type: number
          format: double
    NullableOfTransactionType:
      type: string
      nullable: true
      enum:
      - Income
      - Expense
      description: Omit the query parameter to include both types.
    PagedResponseOfTransactionResponse:
      required:
      - items
      - page
      - pageSize
      - totalCount
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransactionResponse'
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
      description: page starts at 1. totalCount is the number of rows matching the filters, before paging.
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
    ReportSummaryResponse:
      required:
      - totalBalance
      - totalIncome
      - totalExpense
      - net
      type: object
      properties:
        totalBalance:
          type: number
          format: double
          description: Decimal with at most 2 fraction digits.
        totalIncome:
          type: number
          format: double
          description: Decimal with at most 2 fraction digits.
        totalExpense:
          type: number
          format: double
          description: Decimal with at most 2 fraction digits.
        net:
          type: number
          format: double
          description: Decimal with at most 2 fraction digits.
      description: net is totalIncome minus totalExpense for the range. totalBalance is the sum of the
        user's account balances.
    TransactionResponse:
      required:
      - id
      - accountId
      - categoryId
      - type
      - amount
      - description
      - transactionDate
      - createdAt
      - updatedAt
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          type: number
          format: double
          description: Decimal with at most 2 fraction digits.
        description:
          type: string
        transactionDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TransactionType:
      type: string
      enum:
      - Income
      - Expense
      description: Income or Expense. Send the name, not a number.
    UpdateAccountRequest:
      required:
      - name
      - bank
      type: object
      properties:
        name:
          type: string
        bank:
          type: string
    UpdateBudgetRequest:
      required:
      - categoryId
      - limitAmount
      - alertThreshold
      - period
      - notes
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        limitAmount:
          type: number
          format: double
          description: Decimal with at most 2 fraction digits.
        alertThreshold:
          type: integer
          format: int32
        period:
          $ref: '#/components/schemas/BudgetPeriod'
        notes:
          type: string
          nullable: true
    UpdateCategoryRequest:
      required:
      - name
      type: object
      properties:
        name:
          type: string
    UpdateGoalRequest:
      required:
      - name
      - description
      - target
      - targetDate
      - monthlyContribution
      - icon
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        target:
          type: number
          format: double
          description: Decimal with at most 2 fraction digits.
        targetDate:
          type: string
          format: date-time
        monthlyContribution:
          type: number
          format: double
          description: Decimal with at most 2 fraction digits.
        icon:
          type: string
    UpdateTransactionRequest:
      required:
      - accountId
      - categoryId
      - type
      - amount
      - description
      - transactionDate
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          type: number
          format: double
          description: Decimal with at most 2 fraction digits.
        description:
          type: string
        transactionDate:
          type: string
          format: date-time
          nullable: true
    UpdateUserRequest:
      required:
      - name
      type: object
      properties:
        name:
          type: string
    UserResponse:
      required:
      - id
      - name
      - email
      - createdAt
      - updatedAt
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token from POST /api/v1/sessions. Send it as Authorization: Bearer {accessToken}.'
tags:
- name: Authentication
- name: Users
- name: Accounts
- name: Categories
- name: Transactions
- name: Budgets
- name: Goals
- name: Reports
