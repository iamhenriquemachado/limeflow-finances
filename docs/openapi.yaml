openapi: 3.0.1
info:
  title: LimeFlow API
  description: |-
    Personal finance API. This document is the contract for a frontend client.

    ## Auth
    - `POST /api/v1/users` and `POST /api/v1/sessions` are anonymous.
    - Every other route requires `Authorization: Bearer {accessToken}`.
    - Login returns `tokenType: Bearer` and `expiresIn` in seconds (default 3600). There is no refresh token and no logout route. On 401, return to the login screen.
    - A wrong login password returns 401 with detail `Invalid email or password.` A wrong current password returns 401 with detail `Current password is incorrect.`

    ## JSON
    - Bodies and query names are camelCase. Query matching is case-insensitive.
    - Enums are strings, never numbers. `TransactionType` is `Income` or `Expense`. `BudgetPeriod` is `Weekly`, `Monthly`, or `Yearly`.
    - Money fields allow at most 2 decimal places.
    - Dates are ISO-8601 UTC, for example `2026-11-07T17:32:28Z`.

    ## Errors
    Every error is `application/problem+json`.
    - 400 validation: `errors` maps each property name to an array of messages. Show them on the fields.
    - 401 the caller is not authenticated, or the password was rejected.
    - 404 the resource is missing or belongs to another user. Use the same empty state for both.
    - 409 conflict. `detail` says which one: duplicate email, duplicate category name, category used by a transaction or budget, or a budget that already exists for that category and period.
    - 422 a business rule failed. Show `detail`. Examples: category type must match the transaction type; insufficient funds; a transaction date or goal target date is in the future; a withdrawal is greater than `alreadySaved`.
    - 500 unexpected. Do not show a stack trace.

    ## What the screens can rely on
    - Accounts have `name`, `bank`, and `balance`. Balance changes when a transaction is created, updated, or deleted, and when a goal contribution includes `fromAccountId`. Deleting an account also deletes its transactions.
    - Categories have a name unique per user (max 50) and a type. Delete returns 409 when a transaction or budget still uses the category.
    - Transactions are paged. `page` defaults to 1. `pageSize` defaults to 20 and is clamped to 1..100. The list response is `{ items, page, pageSize, totalCount }`. Filters are `accountId`, `categoryId`, `type`, `from`, and `to`. `description` is required, max 200. `transactionDate` may be omitted and then means now. It cannot be in the future. The category type must equal the transaction type.
    - Budgets: one per category and period. Status uses the current UTC period, and the week starts on Monday. `spent` sums Expense transactions in that category. `percentUsed` is an integer. `isOverThreshold` is true when `percentUsed >= alertThreshold`. `isExceeded` is true when `spent > limitAmount`. `remaining` can be negative. `notes` may be null.
    - Goals: `progressPercent` and `isCompleted` are computed. Contribute adds to `alreadySaved`. If `fromAccountId` is set, that account is debited and no expense transaction is created, so reports do not include that debit. Withdraw subtracts from `alreadySaved` and does not credit an account. `targetDate` must be in the future.
    - Reports: `net` is income minus expense in the range. `totalBalance` is the sum of account balances and can differ from `net` after a goal contribution. By-category `percent` is that row's share of the filtered total. Monthly always returns 12 rows, `month` 1 through 12, with zeros when a month has no activity.

    ## Destructive actions
    `DELETE /api/v1/users/me` deletes the user and all of their accounts, categories, transactions, budgets, and goals. Ask for confirmation.
