                items:
                  $ref: '#/components/schemas/AccountResponse'
      security:
      - bearerAuth: []
    post:
      tags:
      - Accounts
      summary: Create an account (balance starts at 0)
      operationId: CreateAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
        required: true
